<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>MTools</title>
<link rel="stylesheet" href="panel.css" />
</head>
<body>
<header>
  <div class="logo"><span>M</span>tools</div>
  <a class="open" id="openApp" href="#" target="_blank" rel="noopener">Открыть сервис ↗</a>
</header>
<nav id="tabs">
  <button data-t="calc" class="active">Калькулятор</button>
  <button data-t="pass">Пароли</button>
  <button data-t="conv">Конвертер</button>
  <button data-t="notes">Заметки</button>
  <button data-t="pomo">Помодоро</button>
  <button data-t="text">Текст</button>
  <button data-t="color">Цвет</button>
  <button data-t="date">Даты</button>
  <button data-t="links">Сервисы</button>
</nav>
<main>
  <section id="calc" class="card">
    <input id="calcExpr" placeholder="0" readonly />
    <div class="res" id="calcRes">0</div>
    <div class="grid" id="calcPad"></div>
  </section>

  <section id="pass" class="card hidden">
    <input id="passOut" readonly placeholder="Нажмите «Сгенерировать»" />
    <div class="row"><label class="muted">Длина <input id="passLen" type="number" min="6" max="64" value="16" /></label></div>
    <div class="row">
      <label class="muted"><input type="checkbox" id="pUp" checked style="width:auto"> A-Z</label>
      <label class="muted"><input type="checkbox" id="pNum" checked style="width:auto"> 0-9</label>
      <label class="muted"><input type="checkbox" id="pSym" checked style="width:auto"> !@#</label>
    </div>
    <div class="row"><button class="btn primary" id="passGen">Сгенерировать</button><button class="btn" id="passCopy">Копировать</button></div>
  </section>

  <section id="conv" class="card hidden">
    <select id="convKind">
      <option value="len">Длина</option><option value="mass">Масса</option><option value="temp">Температура</option>
    </select>
    <div class="row"><input id="convVal" type="number" value="1" /></div>
    <div class="row"><select id="convFrom"></select><select id="convTo"></select></div>
    <div class="res" id="convRes">—</div>
  </section>

  <section id="notes" class="card hidden">
    <textarea id="notesArea" placeholder="Заметки сохраняются автоматически…"></textarea>
    <div class="muted" id="notesSaved">&nbsp;</div>
  </section>

  <section id="pomo" class="card hidden">
    <div class="timer" id="pomoTime">25:00</div>
    <div class="row"><button class="btn primary" id="pomoStart">Старт</button><button class="btn" id="pomoReset">Сброс</button></div>
    <div class="muted" id="pomoMode">Фокус</div>
  </section>
  <section id="text" class="card hidden">
    <textarea id="txtIn" placeholder="Введите текст…" style="min-height:120px"></textarea>
    <div class="muted" id="txtStat">0 символов · 0 слов</div>
    <div class="grid" style="grid-template-columns:repeat(3,1fr)">
      <button class="btn" data-tx="upper">ВЕРХНИЙ</button>
      <button class="btn" data-tx="lower">нижний</button>
      <button class="btn" data-tx="title">Заголовок</button>
      <button class="btn" data-tx="b64e">→ Base64</button>
      <button class="btn" data-tx="b64d">← Base64</button>
      <button class="btn" data-tx="json">JSON</button>
      <button class="btn" data-tx="trim">Убрать пробелы</button>
      <button class="btn" data-tx="copy">Копировать</button>
      <button class="btn" data-tx="clear">Очистить</button>
    </div>
  </section>

  <section id="color" class="card hidden">
    <div class="row"><input id="colHex" value="#1E4FD9" /><input id="colPick" type="color" value="#1E4FD9" style="width:52px;padding:2px" /></div>
    <div id="colSwatch" style="height:64px;border-radius:10px;margin-top:10px;background:#1E4FD9"></div>
    <div class="muted" id="colOut" style="margin-top:8px"></div>
    <div class="row"><button class="btn" id="colRand">Случайный</button><button class="btn primary" id="colCopy">Копировать RGB</button></div>
  </section>

  <section id="date" class="card hidden">
    <label class="muted">Дата A<input id="dA" type="date" /></label>
    <label class="muted" style="display:block;margin-top:8px">Дата B<input id="dB" type="date" /></label>
    <div class="res" id="dDiff">—</div>
    <div class="muted">Unix timestamp</div>
    <div class="row"><input id="tsIn" placeholder="1730000000" /><button class="btn" id="tsGo">→</button></div>
    <div class="muted" id="tsOut">&nbsp;</div>
  </section>

  <section id="links" class="card hidden">
    <div class="row"><input id="syncToken" placeholder="Ключ синхронизации из /extension" /><button class="btn primary" id="syncGo">⟳</button></div>
    <div class="muted" id="syncState">Вставьте ключ, чтобы подтянуть свои инструменты и сервисы.</div>
    <div id="remoteList" style="margin-top:8px"></div>
    <div class="muted" style="margin-top:12px">Свои ссылки</div>
    <div id="linkList" style="margin-top:6px"></div>
    <div class="row"><input id="lName" placeholder="Название" /></div>
    <div class="row"><input id="lUrl" placeholder="https://..." /><button class="btn primary" id="lAdd">+</button></div>
  </section>
</main>
<script src="panel.js"></script>
</body>
</html>
